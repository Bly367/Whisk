name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect package.json
        id: app
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Expo/Node app detected — requiring lint, typecheck, and test."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet (foundation not merged). Skipping Node jobs."
          fi

      - name: Set up Node.js
        if: steps.app.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.app.outputs.present == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Require lint, typecheck, and test scripts
        if: steps.app.outputs.present == 'true'
        run: |
          node <<'EOF'
          const pkg = require('./package.json');
          const scripts = pkg.scripts || {};
          const required = ['lint', 'typecheck', 'test'];
          const missing = required.filter((name) => !scripts[name]);
          if (missing.length) {
            console.error(
              `Required scripts missing from package.json: ${missing.join(', ')}. ` +
                'CI must fail until lint, typecheck, and test are defined (W8 gate).',
            );
            process.exit(1);
          }
          EOF

      - name: Lint
        if: steps.app.outputs.present == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.app.outputs.present == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.app.outputs.present == 'true'
        run: npm test

      - name: Standards placeholder (pre-app)
        if: steps.app.outputs.present != 'true'
        run: |
          echo "W8 CI gate is active. Lint/typecheck/test will run once package.json exists."
          test -f eslint.config.js
          test -f .prettierrc.json
          test -f tsconfig.base.json
          test -f tsconfig.json
          test -f jest.config.js
          test -f docs/architecture.md
          test -f CONTRIBUTING.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f lib/standards/localPersistence.ts
          test -f __tests__/localPersistence.test.ts
          test -f __tests__/ci.workflow.test.ts
